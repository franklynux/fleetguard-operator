# This rule is not used by the project fleetguard-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over fleetguard.fleetguard.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: fleetguard-operator
    app.kubernetes.io/managed-by: kustomize
  name: ttlcleanup-admin-role
rules:
- apiGroups:
  - fleetguard.fleetguard.io
  resources:
  - ttlcleanups
  verbs:
  - '*'
- apiGroups:
  - fleetguard.fleetguard.io
  resources:
  - ttlcleanups/status
  verbs:
  - get
