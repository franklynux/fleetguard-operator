# This rule is not used by the project fleetguard-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the fleetguard.fleetguard.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: fleetguard-operator
    app.kubernetes.io/managed-by: kustomize
  name: ttlcleanup-editor-role
rules:
- apiGroups:
  - fleetguard.fleetguard.io
  resources:
  - ttlcleanups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fleetguard.fleetguard.io
  resources:
  - ttlcleanups/status
  verbs:
  - get
